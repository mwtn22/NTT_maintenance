services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: outage
      POSTGRES_PASSWORD: outage
      POSTGRES_DB: outage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
