[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "crates/connectors",
    "crates/ingest",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
governor = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1"

# Internal crates
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
connectors = { path = "crates/connectors" }
ingest = { path = "crates/ingest" }
